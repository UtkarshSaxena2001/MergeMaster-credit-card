spring.application.name=mergemaster-credit-card
server.port=8080

# ---------------------------------------------------------------------------
# Database configuration
# ---------------------------------------------------------------------------
# Oracle database connection to local FREE database.
# Override with ORACLE_DB_URL, ORACLE_DB_USERNAME, ORACLE_DB_PASSWORD env vars
# to connect to a different Oracle instance.
# ---------------------------------------------------------------------------
spring.datasource.url=${ORACLE_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREE}
spring.datasource.driver-class-name=${ORACLE_DRIVER_CLASS:oracle.jdbc.OracleDriver}
spring.datasource.username=${ORACLE_DB_USERNAME:SYSTEM}
spring.datasource.password=${ORACLE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.OracleDialect}

# CORS - Allow Oracle JET frontend on port 8000 to call the API
app.cors.allowed-origins=http://localhost:8000,http://127.0.0.1:8000
