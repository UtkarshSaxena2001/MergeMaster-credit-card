<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <title>MergeMaster Credit Operations</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101b3d">
    <link rel="icon" href="css/images/JET-Favicon-Red-32x32.png" type="image/x-icon">

    <!-- injector:theme -->
    <!-- endinjector -->
    <!-- injector:font -->
    <!-- endinjector:font -->
    <link rel="stylesheet" href="css/app.css" type="text/css">
  </head>
  <body class="oj-web-applayout-body">
    <script type="text/html" id="navTemplate">
      <li><a href="#"><span :class="[[$data.detail.iconClass]]"></span><oj-bind-text value="[[$data.detail.label]]"></oj-bind-text></a></li>
    </script>

    <div id="globalBody">
      <div id="announce" tabindex="-1" class="send-off-screen" :aria-live="[[manner]]" aria-atomic="true"><p><oj-bind-text value="[[message]]"></oj-bind-text></p></div>

      <div class="app-toast" role="status" aria-live="polite" data-bind="visible: toastVisible, css: 'app-toast app-toast-' + toastKind()">
        <span data-bind="text: toastMessage"></span>
        <button type="button" aria-label="Dismiss notification" data-bind="click: dismissToast">×</button>
      </div>

      <oj-drawer-popup id="navDrawer" edge="start" opened="{{sideDrawerOn}}" modality="modeless" role="navigation" class="app-mobile-drawer" on-opened-changed="[[openedChangedHandler]]">
        <div class="drawer-brand"><span class="brand-mark">M</span><span>MergeMaster</span></div>
        <oj-navigation-list id="navDrawerList" data="[[navDataProvider]]" item.renderer="[[oj.KnockoutTemplateUtils.getRenderer('navTemplate', true)]]" on-click="[[toggleDrawer]]" selection="{{selection.path}}"></oj-navigation-list>
      </oj-drawer-popup>

      <div id="pageContent" class="oj-web-applayout-page app-page">
        <header role="banner" class="app-header">
          <div class="app-header-inner">
            <button id="drawerToggleButton" class="drawer-toggle" type="button" aria-label="Open navigation" data-bind="click: toggleDrawer">☰</button>
            <a class="app-brand" href="?root=dashboard" aria-label="MergeMaster dashboard"><span class="brand-mark">M</span><span><strong data-bind="text: appName"></strong><small>Credit operations</small></span></a>
            <div class="header-spacer"></div>
            <div class="header-user"><span class="header-user-dot"></span><span data-bind="text: userLogin"></span></div>
          </div>
          <nav class="app-nav" aria-label="Primary navigation">
            <oj-tab-bar id="navTabBar" data="[[navDataProvider]]" edge="top" item.renderer="[[oj.KnockoutTemplateUtils.getRenderer('navTemplate', true)]]" selection="{{selection.path}}"></oj-tab-bar>
          </nav>
        </header>

        <main class="app-main" role="main">
          <oj-module config="[[moduleAdapter.koObservableConfig]]"></oj-module>
        </main>

        <footer class="app-footer" role="contentinfo">
          <div><span class="brand-mark brand-mark-small">M</span><span>MergeMaster · Credit operations console</span></div>
          <ul>
            <oj-bind-for-each data="[[footerLinks]]">
              <template><li><a :id="[[$current.data.linkId]]" :href="[[$current.data.linkTarget]]"><oj-bind-text value="[[$current.data.name]]"></oj-bind-text></a></li></template>
            </oj-bind-for-each>
          </ul>
        </footer>
      </div>
    </div>

    <!-- injector:scripts -->
    <!-- endinjector -->
  </body>
</html>
