<section class="page-shell">
  <header class="page-heading">
    <div>
      <p class="eyebrow">Credit card module</p>
      <h1>Card portfolio</h1>
      <p class="page-subtitle">Issue cards, maintain credit settings and monitor utilization.</p>
    </div>
    <button class="button button-primary" type="button" data-bind="click: openCreate">+ Issue card</button>
  </header>

  <div class="status-panel status-panel-error" data-bind="visible: error">
    <strong>Couldn’t load cards.</strong><span data-bind="text: error"></span>
    <button class="link-button" type="button" data-bind="click: refresh">Try again</button>
  </div>

  <div class="surface-card form-card card-editor" data-bind="visible: formVisible">
    <div class="surface-card-header">
      <div>
        <p class="eyebrow" data-bind="text: isEditing() ? 'Update card' : 'New card issue'"></p>
        <h2 data-bind="text: isEditing() ? 'Edit card settings' : 'Issue a card'"></h2>
      </div>
      <button class="icon-button" type="button" aria-label="Close card form" data-bind="click: closeForm">×</button>
    </div>
    <form class="form-grid" data-bind="submit: submitForm" novalidate>
      <label class="field field-span-2">
        <span>Card number</span>
        <div class="input-with-action">
          <input type="text" maxlength="16" inputmode="numeric" placeholder="16 digit card number" data-bind="value: cardNumber, valueUpdate: 'input', disable: isEditing">
          <button class="text-action" type="button" data-bind="click: generateCardNumber, visible: !isEditing()">Generate</button>
        </div>
      </label>
      <label class="field field-span-2">
        <span>Cardholder</span>
        <select data-bind="options: customerOptions, optionsText: 'label', optionsValue: 'id', value: customerId, optionsCaption: 'Select an existing customer'"></select>
      </label>
      <label class="field">
        <span>Card tier</span>
        <select data-bind="options: cardTypes, value: cardType"></select>
      </label>
      <label class="field">
        <span>Status</span>
        <select data-bind="options: statusOptions, value: cardStatus"></select>
      </label>
      <label class="field">
        <span>Credit limit</span>
        <input type="number" min="1" step="0.01" inputmode="decimal" data-bind="value: creditLimit, valueUpdate: 'input'">
      </label>
      <label class="field">
        <span>Opening / outstanding balance</span>
        <input type="number" min="0" step="0.01" inputmode="decimal" data-bind="value: outstandingAmount, valueUpdate: 'input'">
      </label>
      <label class="field">
        <span>Expiry date</span>
        <input type="date" data-bind="value: expiryDate">
      </label>
      <div class="credit-preview field">
        <span>Available credit</span>
        <strong data-bind="text: formatCurrency(availableCredit())"></strong>
        <small><span data-bind="text: utilization"></span>% utilization</small>
      </div>
      <div class="form-error field-span-2" data-bind="visible: formError, text: formError"></div>
      <div class="form-actions field-span-2">
        <button class="button button-secondary" type="button" data-bind="click: closeForm, disable: formBusy">Cancel</button>
        <button class="button button-primary" type="submit" data-bind="disable: formBusy">
          <span data-bind="text: formBusy() ? 'Saving…' : (isEditing() ? 'Save card' : 'Issue card')"></span>
        </button>
      </div>
    </form>
  </div>

  <article class="surface-card data-card">
    <div class="data-toolbar">
      <div class="search-field"><span aria-hidden="true">⌕</span><input type="search" aria-label="Search cards" placeholder="Search card, tier, customer or status" data-bind="value: searchText, valueUpdate: 'input'"></div>
      <button class="button button-quiet" type="button" data-bind="click: refresh, disable: isLoading">Refresh</button>
    </div>
    <div class="loading-panel" data-bind="visible: isLoading"><span class="loading-spinner"></span> Loading cards…</div>
    <div class="card-grid" data-bind="visible: !isLoading() && !error() && filteredCards().length, foreach: filteredCards">
      <article class="credit-card-tile" data-bind="css: $parent.cardTileClass($data)">
        <div class="credit-card-topline"><span data-bind="text: cardType + ' CARD'"></span><span class="status-badge" data-bind="css: cardStatus === 'ACTIVE' ? 'status-active' : 'status-blocked', text: cardStatus"></span></div>
        <div class="credit-card-number" data-bind="text: $parent.maskCardNumber(cardNumber)"></div>
        <div class="credit-card-name" data-bind="text: $parent.customerLabel($data)"></div>
        <div class="credit-card-meta"><span>Expires <strong data-bind="text: $parent.formatDate(expiryDate)"></strong></span><span>Available <strong data-bind="text: $parent.formatCurrency(availableCredit)"></strong></span></div>
        <div class="card-usage"><div><span>Utilization</span><strong><span data-bind="text: $parent.cardUtilization($data)"></span>%</strong></div><div class="mini-track"><i data-bind="style: { width: $parent.cardUtilization($data) + '%' }"></i></div></div>
        <div class="card-tile-actions"><button class="text-action" type="button" data-bind="click: $parent.openEdit">Manage</button><button class="text-action text-action-danger" type="button" data-bind="click: $parent.deleteCard">Delete</button></div>
      </article>
    </div>
    <div class="empty-state" data-bind="visible: !isLoading() && !error() && filteredCards().length === 0">
      <strong data-bind="text: searchText() ? 'No matching cards' : 'No cards in the portfolio'"></strong>
      <span data-bind="text: searchText() ? 'Try a different card or customer search.' : 'Add a customer, then issue their first card.'"></span>
    </div>
  </article>
</section>
